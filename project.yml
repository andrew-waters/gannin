name: Gannin
options:
  bundleIdPrefix: dev.andon
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  # The terminal Claude Code sessions run in.
  # Held to 1.20: 1.99 makes TerminalView's `terminal` internal, which the
  # sessions' terminals read.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minorVersion: 1.20.0
  # Updates for the Mac app outside the App Store, from gannin.ai's appcast.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
  # Syntax colours for the code in a pull request's diff.
  HighlighterSwift:
    url: https://github.com/smittytone/HighlighterSwift
    from: 3.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: AKC33ZRNL9
    CODE_SIGN_STYLE: Automatic
    # Placeholders: a release takes its version from the tag and its build
    # number from the run (.github/workflows/release.yml).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Gannin:
    type: application
    platform: macOS
    sources:
      # Gannin/Demo is the demo build's alone, so none of it ships.
      - path: Gannin
        excludes:
          - "Demo/**"
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
      - package: HighlighterSwift
        product: Highlighter
    scheme:
      testTargets:
        - GanninTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andon.gannin
        PRODUCT_NAME: Gannin
        INFOPLIST_KEY_CFBundleDisplayName: Gannin
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        GENERATE_INFOPLIST_FILE: YES
        # Not sandboxed: Claude Code sessions run git, gh and claude as you.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Sparkle's feed and key, merged into the generated Info.plist.
        INFOPLIST_FILE: Gannin/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Unit tests, hosted in the app: `xcodebuild test -scheme Gannin`.
  GanninTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GanninTests
    dependencies:
      - target: Gannin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andon.gannin.tests
        GENERATE_INFOPLIST_FILE: YES
  # The demo build for screenshots (docs/SCREENSHOTS.md): the same app on
  # invented data, sealed from GitHub, the keychain and the real app's
  # files, under its own bundle ID so it runs beside the real Gannin. CI
  # builds and tests it; the release workflow never does.
  Gannin Demo:
    type: application
    platform: macOS
    sources:
      - Gannin
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
      - package: HighlighterSwift
        product: Highlighter
    scheme:
      testTargets:
        - GanninDemoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andon.gannin.demo
        PRODUCT_NAME: Gannin Demo
        INFOPLIST_KEY_CFBundleDisplayName: Gannin Demo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEMO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: Gannin/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The demo build's tests (its seal and fixtures), hosted in it.
  GanninDemoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GanninDemoTests
    dependencies:
      - target: Gannin Demo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andon.gannin.demo.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEMO
