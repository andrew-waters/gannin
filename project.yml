name: Gannin
options:
  bundleIdPrefix: dev.andon
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  # The terminal Claude Code sessions run in.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
  # Updates for the Mac app outside the App Store, from gannin.ai's appcast.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: AKC33ZRNL9
    CODE_SIGN_STYLE: Automatic
    # Placeholders: a release takes its version from the tag and its build
    # number from the run (.github/workflows/release.yml).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Gannin:
    type: application
    platform: macOS
    sources:
      - Gannin
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andon.gannin
        PRODUCT_NAME: Gannin
        INFOPLIST_KEY_CFBundleDisplayName: Gannin
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        GENERATE_INFOPLIST_FILE: YES
        # Not sandboxed: Claude Code sessions run git, gh and claude as you.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Sparkle's feed and key, merged into the generated Info.plist.
        INFOPLIST_FILE: Gannin/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
