name: Pages

# gannin.ai is this repo's GitHub Pages site: site/, the docs built from
# docs-site/ under /docs, plus appcast.xml, which
# isn't kept here but attached to each release by release.yml and taken from
# the latest one, so Sparkle always sees the newest. Deployed on every push to
# main that touches site/ or docs-site/, and by release.yml once a release is
# published. Any step failing fails the job, so nothing is deployed.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build the docs
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      # Fails when the latest release has no appcast.xml, rather than
      # publishing a site that installed copies can't update from.
      - name: Put the site together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          rsync -a --exclude README.md site/ _site/
          cp -R docs-site/dist _site/docs
          gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir _site
          cat _site/appcast.xml

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
