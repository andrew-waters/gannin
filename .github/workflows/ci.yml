name: CI

# Builds the Mac app and runs its tests on every pull request and push to
# main, unsigned, so a broken build or a failing test is caught before a
# release tag is. Releases are release.yml.
#
# A pull request that only touches the changelog, Gannin's session files, plans
# or requirements skips the build and docs jobs, since nothing in them is built,
# tested or read by the docs job. The skip is per job, not a workflow-level paths-ignore: the
# main ruleset requires the `build` check, and a workflow that never starts
# never reports it, whereas a skipped job counts as passing. Pushes to main
# always run, so every commit there has a `build` status.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Relevant unless every changed file is CHANGELOG.md or under .gannin/,
      # sessions/, plans/ or requirements/.
      - name: Check for changes other than the changelog and Gannin's own files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          relevant=true
          if [ "$EVENT" = "pull_request" ]; then
            # A failed diff (a commit missing from the clone, no merge base)
            # must not read as "nothing else changed".
            changed=$(git diff --name-only --no-renames "$BASE...$HEAD") || { echo "git diff failed; running CI"; changed=x; }
            others=$(printf '%s\n' "$changed" | grep -vE '^(CHANGELOG\.md$|\.gannin/|sessions/|plans/|requirements/)' || true)
            [ -z "$others" ] && relevant=false
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Runs unless `changes` positively said to skip: if it failed, its output
    # is empty, and a skipped `build` would satisfy the ruleset unbuilt.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # The app targets macOS 26, so its SDK, so a Tahoe runner.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # The version in project.yml is a placeholder that release.yml replaces
      # from the tag. A hand-edited one could disagree with the tag it ships
      # under, and development builds rely on 0.0.0 to keep Sparkle quiet.
      - name: Check the version is the placeholder
        run: |
          if ! grep -qE '^    MARKETING_VERSION: "0\.0\.0"$' project.yml; then
            echo "project.yml must keep MARKETING_VERSION \"0.0.0\"; releases take theirs from the tag."
            grep -n MARKETING_VERSION project.yml
            exit 1
          fi

      # The project is generated from project.yml and isn't checked in.
      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache SwiftPM packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Test the remote control package
        run: swift test --package-path Packages/GanninRemote

      - name: Build the Mac app
        run: |
          xcodebuild build \
            -project Gannin.xcodeproj \
            -scheme Gannin \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the iPhone app
        run: |
          xcodebuild build \
            -project Gannin.xcodeproj \
            -scheme GanninPhone \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # The unit tests (GanninTests), run in the app as their host.
      - name: Run the tests
        run: |
          xcodebuild test \
            -project Gannin.xcodeproj \
            -scheme Gannin \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

  # The user docs (docs-site/): they must build, and every control in the
  # Settings views must be named on its Settings reference page.
  docs:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Check every setting is in the Settings reference
        working-directory: docs-site
        run: node scripts/check-settings.mjs

      - name: Build the docs
        working-directory: docs-site
        run: |
          npm ci
          npm run build
